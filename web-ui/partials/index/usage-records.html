                    <details class="usage-card usage-records" id="usage-records-report" @toggle="toggleUsageRecords($event)">
                        <summary>{{ t('usage.records.title') }}</summary>
                        <p class="usage-list-meta">{{ t('usage.records.scope') }}</p>
                        <p v-if="usageRecordsLoading" role="status">{{ t('usage.loading') }}</p>
                        <p v-if="usageRecordsError" role="alert">{{ usageRecordsError }}</p>
                        <template v-if="usageRecords">
                            <p class="usage-list-meta">{{ t('usage.records.coverage', { scanned: usageRecords.summary.scannedSessions, candidates: usageRecords.summary.candidateSessions, unreported: usageRecords.summary.unreportedSessions, unsupported: usageRecords.summary.unsupportedSessions }) }}</p>
                            <p v-if="usageRecords.summary.failedSessions.length" role="alert">{{ t('usage.records.failed', { count: usageRecords.summary.failedSessions.length }) }}</p>
                            <div class="usage-kpi-grid">
                                <div class="usage-kpi-card"><div class="usage-kpi-label">{{ t('usage.records.total') }}</div><div class="usage-kpi-value">{{ formatUsageRecordCount(usageRecords.summary.totalTokens) }}</div></div>
                                <div class="usage-kpi-card"><div class="usage-kpi-label">{{ t('usage.records.estimated') }}</div><div class="usage-kpi-value">{{ formatUsageRecordCount(usageRecords.summary.estimatedTextTokens) }}</div></div>
                                <div class="usage-kpi-card"><div class="usage-kpi-label">{{ t('usage.records.cacheRead') }}</div><div class="usage-kpi-value">{{ formatUsageRecordCount(usageRecords.summary.cachedInputTokens) }}</div></div>
                                <div class="usage-kpi-card"><div class="usage-kpi-label">{{ t('usage.records.cacheWrite') }}</div><div class="usage-kpi-value">{{ formatUsageRecordCount(usageRecords.summary.cacheCreationInputTokens) }}</div></div>
                            </div>
                            <p v-if="usageRecords.summary.undatedTokens" class="usage-list-meta">{{ t('usage.records.undated', { tokens: usageRecords.summary.undatedTokens }) }}</p>
                            <div class="usage-records-table">
                                <table>
                                    <thead><tr><th>{{ t('usage.records.date') }}</th><th>{{ t('usage.records.source') }}</th><th>{{ t('usage.records.model') }}</th><th>{{ t('usage.records.input') }}</th><th>{{ t('usage.records.cacheRead') }}</th><th>{{ t('usage.records.cacheWrite') }}</th><th>{{ t('usage.records.output') }}</th><th>{{ t('usage.records.total') }}</th></tr></thead>
                                    <tbody><tr v-for="row in usageRecords.rows" :key="row.date + ':' + row.source + ':' + row.model"><td>{{ row.date || t('usage.records.unknown') }}</td><td>{{ row.source }}</td><td>{{ row.model }}</td><td>{{ formatUsageRecordCount(row.inputTokens) }}</td><td>{{ formatUsageRecordCount(row.cachedInputTokens) }}</td><td>{{ formatUsageRecordCount(row.cacheCreationInputTokens) }}</td><td>{{ formatUsageRecordCount(row.outputTokens) }}</td><td>{{ formatUsageRecordCount(row.totalTokens) }}</td></tr></tbody>
                                </table>
                            </div>
                            <p v-if="!usageRecords.rows.length">{{ t('usage.empty') }}</p>
                        </template>
                        <button v-if="!usageRecordsLoading" type="button" class="btn-mini" @click="loadUsageRecords({ forceRefresh: true })">{{ t('usage.refresh') }}</button>
                    </details>

                    <details class="usage-card usage-pricing" id="usage-price-reference" @toggle="toggleUsagePricing($event)">
                        <summary>{{ t('pricing.title') }}</summary>
                        <p class="usage-list-meta">{{ t('pricing.scope') }}</p>
                        <p v-if="usagePricingBusy" role="status">{{ t('usage.loading') }}</p>
                        <p v-if="usagePricingError" role="alert">{{ usagePricingError }}</p>
                        <template v-if="usagePricing">
                            <p class="usage-price-total">{{ t('pricing.total') }}: {{ formatPriceUsd(usagePricing.summary.estimatedUsd) }}</p>
                            <p class="usage-list-meta">{{ t('pricing.coverage', { known: usagePricing.summary.pricedRows, unknown: usagePricing.summary.unknownRows, failed: usagePricing.summary.failedSessions, unreported: usagePricing.summary.unreportedSessions, unsupported: usagePricing.summary.unsupportedSessions }) }} · {{ t('pricing.subtotal') }}: {{ formatPriceUsd(usagePricing.summary.knownSubtotalUsd) }}</p>
                            <p class="usage-list-meta"><a :href="usagePricing.priceSource.repository" target="_blank" rel="noopener noreferrer">Wei-Shaw/model-price-repo</a> · {{ usagePricing.priceSource.sourceUpdatedAt }} · <code>{{ usagePricing.priceSource.commit.slice(0, 12) }}</code></p>
                            <div class="usage-records-table"><table><thead><tr><th>{{ t('usage.records.date') }}</th><th>{{ t('usage.records.source') }}</th><th>{{ t('usage.records.model') }}</th><th>{{ t('pricing.total') }}</th><th>{{ t('pricing.basis') }}</th></tr></thead><tbody><tr v-for="row in usagePricing.rows" :key="row.date + ':' + row.source + ':' + row.model"><td>{{ row.date || t('usage.records.unknown') }}</td><td>{{ row.source }}</td><td>{{ row.model }}</td><td>{{ formatPriceUsd(row.estimatedUsd) }}</td><td>{{ t('pricing.reason.' + row.reason) }}<span v-if="row.rates" class="usage-price-rates">{{ t('pricing.rates', { input: formatTokenRate(row.rates.input_cost_per_token), output: formatTokenRate(row.rates.output_cost_per_token), cached: formatTokenRate(row.rates.cache_read_input_token_cost), created: formatTokenRate(row.rates.cache_creation_input_token_cost) }) }}</span></td></tr></tbody></table></div>
                            <p v-if="!usagePricing.rows.length">{{ t('usage.empty') }}</p>
                            <button type="button" class="btn-mini" @click="downloadUsagePricing">{{ t('pricing.download') }}</button>
                        </template>
                        <button type="button" class="btn-mini" @click="loadUsagePricing" :disabled="usagePricingBusy">{{ t('usage.refresh') }}</button>
                    </details>
