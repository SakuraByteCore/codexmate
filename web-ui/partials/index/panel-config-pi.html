                    <button v-if="isConfigModeVisible('claude')" type="button" :class="['segment', { active: configMode === 'claude' }]" @click="switchConfigMode('claude')">{{ t('tab.config.claude') }}</button>
                    <button v-if="isConfigModeVisible('openclaw')" type="button" :class="['segment', { active: configMode === 'openclaw' }]" @click="switchConfigMode('openclaw')">{{ t('tab.config.openclaw') }}</button>
                    <button v-if="isConfigModeVisible('opencode')" type="button" :class="['segment', { active: configMode === 'opencode' }]" @click="switchConfigMode('opencode')">{{ t('tab.config.opencode') }}</button>
                    <button v-if="isConfigModeVisible('kilocode')" type="button" :class="['segment', { active: configMode === 'kilocode' }]" @click="switchConfigMode('kilocode')">{{ t('tab.config.kilocode') }}</button>
                    <button v-if="isConfigModeVisible('pi')" type="button" :class="['segment', { active: configMode === 'pi' }]" @click="switchConfigMode('pi')">{{ t('tab.config.pi') }}</button>

                        <p class="tool-config-write-desc">{{ t('toolConfig.pi.desc') }}</p>

                    <label class="settings-toggle-row tool-config-write-toggle">

                            autocomplete="off"

                        <span>{{ toolConfigPermissionStatusLabel('pi') }}</span>

                                <div class="summary-title">配置写入路径</div>

                                <div class="summary-item-value"><cwd>/.pi/config.json</cwd></div>

                                <div class="card-list">
                                    <div class="card" role="button" tabindex="0">
                                        <div class="card-leading">
                                            <div class="card-icon">📄</div>
                                            <div class="card-content">

                                                <div class="card-subtitle">全局 Pi 配置文件</div>

                                                        <path d="M10 14L21 3"/>

                                        </div>
                                    </div>
                                </div>

                                <p>{{ t('toolConfig.pi.lockedDesc') }}</p>
                                <button type="button" class="btn-tool" @click="setToolConfigPermission('pi', true)" :disabled="toolConfigPermissionSaving.pi">{{ t('toolConfig.enableWrite') }}</button>
                            </div>
                        </div>
                    </div>
