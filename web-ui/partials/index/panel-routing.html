                <section v-show="mainTab === 'routing'" id="panel-routing" class="mode-content" role="tabpanel" aria-labelledby="tab-routing">
                    <p class="routing-purpose">{{ t(routingTarget === 'openai-chat' ? 'routing.openai.purpose' : 'routing.purpose', { agent: routingTargetName() }) }}</p>
                    <details class="routing-explainer">
                        <summary>{{ t('routing.help.title') }}</summary>
                        <div class="routing-explainer-body">
                            <p>{{ t('routing.help.scope') }}</p>
                            <p>{{ t('routing.help.errors') }}</p>
                            <p>{{ t('routing.help.model') }}</p>
                        </div>
                    </details>
                    <div class="routing-toolbar">
                        <div class="segmented-control" role="group" :aria-label="t('routing.target')">
                            <button v-for="target in ['codex', 'claude', 'openai-chat']" :key="target" type="button"
                                :class="['segment', { active: routingTarget === target }]"
                                :aria-pressed="routingTarget === target" :disabled="!!routingDraft || routingSaving"
                                @click="setRoutingTarget(target)">{{ routingTargetName(target) }}</button>
                        </div>
                        <div class="routing-toolbar-actions">
                            <button type="button" class="btn-tool" :disabled="routingLoading || routingSaving" @click="loadRouting">{{ t('routing.refresh') }}</button>
                            <button type="button" class="btn-tool btn-primary" :disabled="!routingLoaded || routingLoading || routingSaving || !!routingDraft || !routingCatalog().length || !isToolConfigWriteAllowed(routingPermissionTarget())" @click="editRoutingGroup()">{{ t('routing.create') }}</button>
                        </div>
                    </div>
                    <p v-if="routingError" class="routing-error" role="alert">{{ routingError }}</p>
                    <p v-if="routingLoading && !routingLoaded" class="routing-empty" role="status">{{ t('routing.loading') }}</p>
                    <template v-if="routingLoaded">
                        <div class="routing-status-row">
                            <div class="routing-status-copy">
                                <span :class="['routing-state', { 'is-active': routingBridges[routingTarget].active }]">{{ routingStateLabel() }}</span>
                                <p class="routing-hint">{{ t(routingTarget === 'openai-chat' ? 'routing.openai.bindingHint' : 'routing.bindingHint') }}</p>
                            </div>
                            <button v-if="routingBridges[routingTarget].active || routingBindings[routingTarget]" type="button" class="btn-tool" :disabled="routingSaving || routingLoading || !!routingDraft || !isToolConfigWriteAllowed(routingPermissionTarget())" @click="toggleRoutingBridge">
                                {{ t(routingTarget === 'openai-chat' ? 'routing.openai.disable' : routingBridges[routingTarget].active ? 'routing.bridge.disable' : 'routing.bridge.enable') }}
                            </button>
                        </div>
                        <div v-if="!isToolConfigWriteAllowed(routingPermissionTarget())" class="routing-access">
                            <p class="routing-hint">{{ t(routingTarget === 'openai-chat' ? 'routing.openai.permission' : 'routing.readOnly') }}</p>
                            <button type="button" class="btn-tool" :disabled="toolConfigPermissionSaving[routingPermissionTarget()] || routingSaving || routingLoading" @click="setToolConfigPermission(routingPermissionTarget(), true)">{{ t('toolConfig.enableWrite') }}</button>
                        </div>
                        <div v-if="!routingCatalog().length" class="routing-empty routing-provider-notice">
                            <p>{{ t('routing.noProviders') }}</p>
                            <button type="button" class="btn-tool" @click="switchConfigMode(routingPermissionTarget())">{{ t('routing.openConfig') }}</button>
                        </div>
                        <div v-if="routingTarget === 'openai-chat'" class="routing-api-access">
                            <p class="routing-hint">{{ t('routing.openai.providers') }}</p>
                            <div class="routing-api-fields">
                                <label class="routing-field"><span class="form-label">{{ t('routing.openai.baseUrl') }}</span><input class="form-input" readonly :value="routingOpenaiBaseUrl()" @focus="$event.target.select()"></label>
                                <label class="routing-field"><span class="form-label">{{ t('routing.openai.model') }}</span><input class="form-input" readonly :value="routingOpenaiAccess.model" @focus="$event.target.select()"></label>
                            </div>
                            <p class="routing-hint">{{ t(routingOpenaiAccess.requiresToken ? 'routing.openai.auth' : 'routing.openai.localOnly') }}</p>
                            <p class="routing-hint">{{ t('routing.openai.alias') }}</p>
                        </div>
                        <form v-if="routingDraft" class="routing-editor" novalidate @submit.prevent="saveRoutingGroup">
                            <button type="button" class="btn-tool routing-icon-btn routing-editor-close" :disabled="routingSaving" :aria-label="t('common.cancel')" :title="t('common.cancel')" @click="cancelRoutingEdit">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" focusable="false"><path d="m6 6 12 12M18 6 6 18"/></svg>
                            </button>
                            <fieldset :disabled="routingSaving || routingLoading || !isToolConfigWriteAllowed(routingPermissionTarget())">
                                <legend>{{ t(routingDraft.id ? 'routing.edit' : 'routing.create') }}</legend>
                                <p v-if="routingDraft.id && routingBindings[routingTarget] === routingDraft.id && routingBridges[routingTarget].active" class="routing-hint routing-edit-warning">{{ t('routing.editActive') }}</p>
                                <div class="routing-form-head">
                                    <label class="routing-field">
                                        <span class="form-label">{{ t('routing.name') }}</span>
                                        <input ref="routingNameInput" class="form-input" v-model.trim="routingDraft.name" required maxlength="128" autocomplete="off">
                                    </label>
                                    <label class="routing-field">
                                        <span class="form-label">{{ t('routing.strategy') }}</span>
                                        <select class="model-select" v-model="routingDraft.strategy">
                                            <option value="order">{{ t('routing.strategy.order') }}</option>
                                            <option value="rotate">{{ t('routing.strategy.rotate') }}</option>
                                        </select>
                                    </label>
                                </div>
                                <p class="routing-hint">{{ t('routing.strategy.' + routingDraft.strategy + '.hint') }}</p>
                                <ol class="routing-members">
                                    <li v-for="(member, index) in routingDraft.members" :key="index" class="routing-member">
                                        <span class="routing-member-number"><span>{{ index + 1 }}</span><span class="routing-member-role">{{ routingMemberRole(index, routingDraft.strategy) }}</span></span>
                                        <label class="routing-field">
                                            <span class="form-label">{{ t('routing.provider') }}</span>
                                            <select class="model-select" v-model="member.provider" required @change="setRoutingMemberProvider(index)">
                                                <option value="" disabled>{{ t('routing.selectProvider') }}</option>
                                                <option v-if="member.provider && !routingCatalog().some(entry => entry.name === member.provider)" :value="member.provider">{{ member.provider }} · {{ t('routing.unavailable') }}</option>
                                                <option v-for="entry in routingCatalog()" :key="entry.name" :value="entry.name">{{ entry.name }}</option>
                                            </select>
                                        </label>
                                        <label class="routing-field">
                                            <span class="form-label">{{ t('routing.model') }}</span>
                                            <input class="form-input" v-model.trim="member.model" required maxlength="256" autocomplete="off" :placeholder="t('routing.modelHint')">
                                        </label>
                                        <div class="routing-member-actions">
                                            <button type="button" class="btn-tool routing-icon-btn" :disabled="index === 0" :aria-label="t('routing.moveUp')" :title="t('routing.moveUp')" @click="moveRoutingMember(index, -1)">
                                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" focusable="false"><path d="m6 14 6-6 6 6"/></svg>
                                            </button>
                                            <button type="button" class="btn-tool routing-icon-btn" :disabled="index === routingDraft.members.length - 1" :aria-label="t('routing.moveDown')" :title="t('routing.moveDown')" @click="moveRoutingMember(index, 1)">
                                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" focusable="false"><path d="m6 10 6 6 6-6"/></svg>
                                            </button>
                                            <button type="button" class="btn-tool routing-icon-btn" :disabled="routingDraft.members.length === 1" :aria-label="t('routing.removeMember')" :title="t('routing.removeMember')" @click="routingDraft.members.splice(index, 1)">
                                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" focusable="false"><path d="m6 6 12 12M18 6 6 18"/></svg>
                                            </button>
                                        </div>
                                    </li>
                                </ol>
                                <div class="routing-editor-actions">
                                    <button type="button" class="btn-tool" :disabled="routingDraft.members.length >= 16" @click="addRoutingMember">{{ t('routing.addMember') }}</button>
                                    <button type="submit" class="btn-tool btn-primary">{{ t(routingSaving ? 'routing.working' : 'routing.save') }}</button>
                                </div>
                            </fieldset>
                        </form>
                        <div v-if="!routingGroupsForTarget().length && !routingDraft && routingCatalog().length" class="routing-empty">
                            <p>{{ t('routing.empty') }}</p>
                            <ol class="routing-start-steps">
                                <li>{{ t('routing.start.create') }}</li>
                                <li>{{ t('routing.start.save') }}</li>
                                <li>{{ t('routing.start.enable') }}</li>
                                <li>{{ t(routingTarget === 'openai-chat' ? 'routing.openai.use' : 'routing.start.use') }}</li>
                            </ol>
                        </div>
                        <ul class="routing-groups">
                            <li v-for="group in routingGroupsForTarget()" :key="group.id" class="routing-group-row">
                                <div class="routing-group-copy">
                                    <div class="routing-group-title">
                                        <strong>{{ group.name }}</strong>
                                        <span v-if="routingBindings[routingTarget] === group.id" class="routing-bound">{{ t(routingBridges[routingTarget].active ? 'routing.inUse' : 'routing.awaitingEnable') }}</span>
                                    </div>
                                    <span class="routing-group-meta">{{ t('routing.strategy.' + group.strategy) }}</span>
                                    <details class="routing-group-details" :open="routingBindings[routingTarget] === group.id">
                                        <summary>{{ t('routing.memberCount', { count: group.members.length }) }}</summary>
                                        <ol class="routing-group-path">
                                            <li v-for="(member, index) in group.members" :key="index"><span class="routing-member-role">{{ routingMemberRole(index, group.strategy) }}</span> {{ member.provider }} / {{ member.model }}<span v-if="!routingCatalog().some(entry => entry.name === member.provider)" class="routing-hint"> · {{ t('routing.unavailable') }}</span></li>
                                        </ol>
                                        <div v-if="routingTarget !== 'openai-chat'" class="routing-secondary-actions">
                                            <button type="button" class="btn-tool" :disabled="routingSaving || routingLoading || !!routingDraft || !isToolConfigWriteAllowed(routingPermissionTarget())" @click="bindRoutingGroup(routingBindings[routingTarget] === group.id ? '' : group.id)">{{ t(routingBindings[routingTarget] === group.id ? 'routing.unbind' : 'routing.bind') }}</button>
                                        </div>
                                    </details>
                                </div>
                                <div class="routing-group-actions">
                                    <button type="button" :class="['btn-tool', { 'btn-primary': routingBindings[routingTarget] !== group.id || !routingBridges[routingTarget].active }]"
                                        :disabled="routingSaving || routingLoading || !!routingDraft || !isToolConfigWriteAllowed(routingPermissionTarget())"
                                        :aria-busy="routingSaving && routingPendingGroupId === group.id" @click="useRoutingGroup(group)">
                                        {{ t(routingSaving && routingPendingGroupId === group.id ? 'routing.working' : (routingBindings[routingTarget] === group.id && routingBridges[routingTarget].active ? 'routing.restorePool' : (routingBridges[routingTarget].active ? 'routing.useGroup' : 'routing.bindEnable'))) }}
                                    </button>

                                    <button type="button" class="btn-tool routing-icon-btn" :disabled="routingSaving || routingLoading || !!routingDraft || !isToolConfigWriteAllowed(routingPermissionTarget())" :aria-label="t('routing.edit')" :title="t('routing.edit')" @click="editRoutingGroup(group)">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" focusable="false"><path d="m15 5 4 4M4 20l4-1L20 7l-4-4L4 15z"/></svg>
                                    </button>
                                    <button type="button" class="btn-tool routing-icon-btn routing-delete" :disabled="routingSaving || routingLoading || !!routingDraft || routingBindings[routingTarget] === group.id || !isToolConfigWriteAllowed(routingPermissionTarget())" :aria-label="t('routing.delete')" :title="t('routing.delete')" @click="deleteRoutingGroup(group)">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" focusable="false"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 10v7M14 10v7"/></svg>
                                    </button>
                                </div>
                            </li>
                        </ul>
                    </template>
                </section>
