<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Codex Mate 启动失败</title>
<style>
body { margin: 0; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; background: #1e1e2e; color: #cdd6f4; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
h1 { font-size: 20px; font-weight: 600; margin: 0 0 16px; }
pre { max-width: 80vw; max-height: 40vh; overflow: auto; background: #11111b; color: #f38ba8; padding: 12px 16px; border-radius: 8px; font-size: 12px; white-space: pre-wrap; }
button { margin-top: 20px; padding: 8px 28px; border: none; border-radius: 6px; background: #89b4fa; color: #1e1e2e; font-size: 14px; cursor: pointer; }
button:hover { background: #74c7ec; }
</style>
</head>
<body>
<h1>后端服务启动失败</h1>
<pre id="message"></pre>
<button id="retry">重试</button>
<script>
document.getElementById('message').textContent = new URLSearchParams(location.search).get('message') || '未知错误';
document.getElementById('retry').addEventListener('click', function () { window.desktopBridge.retry(); });
</script>
</body>
</html>
